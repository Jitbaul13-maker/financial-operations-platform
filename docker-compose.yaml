services:

  postgres:
    image: postgres:17
    container_name: finops-postgres

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: finops-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  backend:
    build: .
    container_name: financial-backend
    ports:
      - "8080:8080"
    env_file:
      - .env

    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: